name = "hf-space-openai-worker-template"
main = "src/index.ts"
compatibility_date = "2026-05-31"
keep_vars = true

[observability]
enabled = true

[vars]
HF_SPACE_BASE_URL = "https://noxwano-hy-mt2.hf.space"
HF_API_MODE = "gradio_sse"
OPENAI_DEFAULT_MODEL = "tencent/Hy-MT2-1.8B"
DEFAULT_TARGET_LANG = "English"
ADAPTER_NAME = "gradio-translate"
GRADIO_API_NAME = "translate"
GRADIO_SUBMIT_PATH = "/gradio_api/call/v2/translate"
GRADIO_RESULT_PATH_TEMPLATE = "/gradio_api/call/translate/{event_id}"
HF_MODEL_LIST = "tencent/Hy-MT2-30B-A3B,tencent/Hy-MT2-7B,tencent/Hy-MT2-1.8B"
HF_TARGET_LANG_LIST = "Arabic,Bengali,Burmese,Cantonese,Chinese,Czech,Dutch,English,Filipino,French,German,Gujarati,Hebrew,Hindi,Indonesian,Italian,Japanese,Kazakh,Khmer,Korean,Malay,Marathi,Mongolian,Persian,Polish,Portuguese,Russian,Spanish,Tamil,Telugu,Thai,Tibetan,Traditional Chinese,Turkish,Ukrainian,Urdu,Uyghur,Vietnamese"
HF_SOURCE_TEXT_PARAM = "source_text"
HF_TARGET_LANG_PARAM = "target_lang"
HF_MODEL_PARAM = "selected_model"
DISABLE_API_KEY_AUTH = "false"
WORKER_API_KEY = "please-change-me"
